services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firsttree}
      POSTGRES_USER: ${POSTGRES_USER:-firsttree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firsttree}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firsttree}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Transitional compatibility for attachment rows written by #2062. New
  # uploads use PostgreSQL; keep MinIO available until the S3 -> PostgreSQL
  # backfill finishes and all pre-transition Server replicas have drained.
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-firsttree}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-firsttree-dev-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/first-tree-attachments
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-firsttree}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-firsttree-dev-secret}

volumes:
  pgdata:
  miniodata:
